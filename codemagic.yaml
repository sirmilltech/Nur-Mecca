workflows:
  ios-workflow:
    name: Nur-Mecca iOS Automatic Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Codemagic_Key"
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.milltech.nurmecca.app
      groups:
        - apple_auth 
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.milltech.nurmecca.app"
        DEVELOPMENT_TEAM: "JBMD9M6ZPC"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "U2SA5VYGH7"
        APP_STORE_APP_ID: 6759008303
      node: 20.11.0
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: develop
          include: true
        - pattern: main
          include: true
    scripts:
      - name: Initialize Environment & Repair iOS Platform
        script: |
          echo "Setting Node version..."
          nvm use 20 || nvm install 20

          # 1. FIX EAGAIN: Install with --ignore-scripts to stop the 'npm run build' infinite loop
          npm install --ignore-scripts

          # 2. FIX Missing appId: Manually ensure the web assets folder exists 
          # Capacitor requires this folder to exist before it can add a platform.
          mkdir -p www
          if [ ! -f "www/index.html" ]; then
            echo "<html><body>Nur-Mecca CI</body></html>" > www/index.html
          fi

          # 3. Repair Platform logic
          echo "Checking if Podfile exists..."
          if [ ! -f "ios/App/Podfile" ]; then
            echo "iOS project is incomplete. Re-adding platform..."
            rm -rf ios
            npx cap add ios
          fi

          echo "Syncing Capacitor..."
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
      - name: Build and Sign iOS App
        script: |
          # Setup API Key for App Store Connect
          if [ -n "$PRIVATE_KEY" ]; then
            mkdir -p ~/.appstoreconnect/private_keys
            echo "$PRIVATE_KEY" | tr -d '\r' > ~/.appstoreconnect/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_IDENTIFIER.p8
          fi

          keychain initialize
          keychain add-certificates || true

          # Detect Provisioning Profile
          PROV_PROFILE_PATH=$(find ~/Library/MobileDevice/Provisioning\ Profiles -name "*.mobileprovision" 2>/dev/null | head -n 1)
          if [ -z "$PROV_PROFILE_PATH" ]; then 
            echo "ERROR: No profile found. Check App Store Connect integration."
            exit 1
          fi
          
          TMP_PLIST=$(mktemp /tmp/provplist.plist)
          security cms -D -i "$PROV_PROFILE_PATH" > "$TMP_PLIST"
          PROV_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$TMP_PLIST")

          # Archive
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/ios/xcarchive/App.xcarchive \
            -allowProvisioningUpdates \
            clean archive

          # Create ExportOptions
          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict><key>method</key><string>app-store</string>
          <key>teamID</key><string>$DEVELOPMENT_TEAM</string>
          <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROV_PROFILE_NAME</string></dict>
          <key>signingStyle</key><string>manual</string></dict></plist>
          EOF

          # Export IPA
          xcodebuild -exportArchive \
            -archivePath build/ios/xcarchive/App.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ExportOptions.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
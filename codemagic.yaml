workflows:
  ios-workflow:
    name: Nur-Mecca iOS Automatic Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "Codemagic_Key"

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.milltech.nurmecca.app

      groups:
        - apple_auth

      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.milltech.nurmecca.app"
        DEVELOPMENT_TEAM: "JBMD9M6ZPC"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "U2SA5VYGH7"
        APP_STORE_APP_ID: 6759008303

      node: 20.11.0
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: develop
          include: true
        - pattern: main
          include: true

    scripts:

      - name: Initialize Environment & Repair iOS Platform
        script: |
          echo "Using Node 20..."
          nvm install 20
          nvm use 20

          npm install

          echo "Ensuring web assets exist..."
          npm run build || (mkdir -p www && echo "<html></html>" > www/index.html)

          echo "Checking if Podfile exists..."
          if [ ! -f "ios/App/Podfile" ]; then
            echo "Podfile missing. Recreating iOS platform..."
            rm -rf ios
            npx cap add ios
          fi

          echo "Syncing Capacitor..."
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install
          cd ../..

      - name: Build and Sign iOS App
        script: |

          echo "Setting up App Store Connect API key..."
          if [ -n "$PRIVATE_KEY" ]; then
            mkdir -p ~/.appstoreconnect/private_keys
            echo "$PRIVATE_KEY" | tr -d '\r' > ~/.appstoreconnect/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_IDENTIFIER.p8
          fi

          echo "Initialize keychain..."
          keychain initialize
          keychain add-certificates || true

          echo "Manual .p12 fallback if needed..."
          CERT_COUNT=$(ls ~/Library/Developer/Xcode/UserData/Certificates/*.p12 2>/dev/null | wc -l || echo "0")

          if [ "$CERT_COUNT" -eq 0 ] && [ -n "$MANUAL_P12_BASE64" ]; then
            mkdir -p ~/Library/Developer/Xcode/UserData/Certificates
            echo "$MANUAL_P12_BASE64" | base64 --decode > ~/Library/Developer/Xcode/UserData/Certificates/manual.p12
            security import ~/Library/Developer/Xcode/UserData/Certificates/manual.p12 -P "${MANUAL_P12_PASSWORD:-}" -A || true
          fi

          echo "Fetching provisioning profile..."
          PROV_PROFILE_PATH=$(find ~/Library/MobileDevice/Provisioning\ Profiles -name "*.mobileprovision" | head -n 1)

          if [ -z "$PROV_PROFILE_PATH" ]; then
            echo "ERROR: No provisioning profile found"
            exit 1
          fi

          TMP_PLIST=$(mktemp /tmp/provplist.plist)
          security cms -D -i "$PROV_PROFILE_PATH" > "$TMP_PLIST"

          PROV_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$TMP_PLIST")
          PROV_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$TMP_PLIST")

          echo "Building archive..."

          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/ios/xcarchive/App.xcarchive \
            -allowProvisioningUpdates \
            clean archive

          echo "Creating ExportOptions.plist..."

          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>$DEVELOPMENT_TEAM</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>$PROV_PROFILE_NAME</string>
              </dict>
              <key>signingStyle</key>
              <string>manual</string>
          </dict>
          </plist>
          EOF

          echo "Exporting IPA..."

          xcodebuild -exportArchive \
            -archivePath build/ios/xcarchive/App.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ExportOptions.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

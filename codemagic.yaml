workflows:
  ios-workflow:
    name: Nur-Mecca iOS Universal Signing Fix
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "Codemagic_Key"

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.milltech.nurmecca.app
      groups:
        - apple_auth
      vars:
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.milltech.nurmecca.app"
        DEVELOPMENT_TEAM: "JBMD9M6ZPC"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "U2SA5VYGH7"
      node: 20.11.0
      xcode: latest

    scripts:
      - name: Increment Build Number
        script: |
          # Use a higher offset to avoid "Redundant Binary" errors
          OFFSET=40
          BUILD_NUM=$((${CM_BUILD_NUMBER:-1} + $OFFSET))
          echo "BUILD_NUMBER=$BUILD_NUM" >> $CM_ENV
          find . -name "project.pbxproj" -exec sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $BUILD_NUM;/g" {} +

      - name: Initialize Environment
        script: |
          npm install --ignore-scripts
          npx cap sync ios

      - name: Fetch Signing & Force Patch Project
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          
          # Extract the UUID of the downloaded profile
          PROV_PROFILE_UUID=$(apple-provisioning-profiles list --bundle-id "$BUNDLE_ID" --type IOS_APP_STORE | grep "UUID" | head -n 1 | awk '{print $2}')
          echo "Infecting project with Profile UUID: $PROV_PROFILE_UUID"
          
          export PROVISIONING_PROFILE_UUID=$PROV_PROFILE_UUID
          
          # This Python script recursively cleans and forces Manual signing on ALL targets
          python3 -c "
          import os, re
          target_uuid = os.getenv('PROVISIONING_PROFILE_UUID')
          team_id = os.getenv('DEVELOPMENT_TEAM')
          
          for root, dirs, files in os.walk('.'):
              for file in files:
                  if file == 'project.pbxproj':
                      path = os.path.join(root, file)
                      with open(path, 'r') as f: content = f.read()
                      
                      # 1. Force Manual Style for all configurations
                      content = re.sub(r'ProvisioningStyle = \w+;', 'ProvisioningStyle = Manual;', content)
                      
                      # 2. Inject Team ID
                      content = re.sub(r'DEVELOPMENT_TEAM = .*?;', f'DEVELOPMENT_TEAM = {team_id};', content)
                      
                      # 3. Force the specific Profile UUID into every possible slot
                      content = re.sub(r'PROVISIONING_PROFILE = .*?;', f'PROVISIONING_PROFILE = \"{target_uuid}\";', content)
                      content = re.sub(r'PROVISIONING_PROFILE_SPECIFIER = .*?;', f'PROVISIONING_PROFILE_SPECIFIER = \"{target_uuid}\";', content)
                      
                      # 4. Critical: Ensure the target is marked as 'Installable'
                      content = re.sub(r'SKIP_INSTALL = YES;', 'SKIP_INSTALL = NO;', content)
                      
                      with open(path, 'w') as f: f.write(content)
                      print(f'Successfully patched all targets in: {path}')
          "
          echo "PROVISIONING_PROFILE_UUID=$PROV_PROFILE_UUID" >> $CM_ENV

      - name: Build and Archive iOS App
        script: |
          XCODE_WORKSPACE=$(find ios -name "*.xcworkspace" | head -n 1)
          
          # Passing signing flags explicitly to override any remaining project settings
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/ios/xcarchive/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_UUID" \
            archive

      - name: Export and Post-Processing
        script: |
          xcodebuild -exportArchive \
            -archivePath build/ios/xcarchive/App.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist /Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
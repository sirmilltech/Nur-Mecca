workflows:
  ios-workflow:
    name: Nur-Mecca iOS Final Signing Fix V22
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "Codemagic_Key"

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.milltech.nurmecca.app
      groups:
        - apple_auth
      vars:
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.milltech.nurmecca.app"
        DEVELOPMENT_TEAM: "JBMD9M6ZPC"
      node: 20.11.0
      xcode: latest

    scripts:
      - name: Increment Build Number
        script: |
          OFFSET=100
          BUILD_NUM=$((${CM_BUILD_NUMBER:-1} + $OFFSET))
          echo "BUILD_NUMBER=$BUILD_NUM" >> $CM_ENV
          find . -name "project.pbxproj" -exec sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $BUILD_NUM;/g" {} +

      - name: Initialize Environment
        script: |
          npm install --ignore-scripts
          npx cap sync ios

      - name: Fetch Signing & Surgical Patch
        script: |
          keychain initialize
          # Clean old certs that might cause "Unknown Distribution Error"
          keychain list-certificates
          
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          
          python3 -c "
          import os, sys, re, glob
          
          dev_team = os.getenv('DEVELOPMENT_TEAM', 'JBMD9M6ZPC')
          profile_path = glob.glob(os.path.expanduser('~/Library/MobileDevice/Provisioning Profiles/*.mobileprovision'))
          
          if not profile_path:
              print('CRITICAL: No provisioning profile found!')
              sys.exit(1)
          
          target_profile = profile_path[0]
          # Extract UUID and Name from the binary plist profile
          with open(target_profile, 'rb') as f:
              content = f.read().decode('latin-1')
              uuid = re.search(r'<key>UUID</key>\s*<string>([^<]+)</string>', content).group(1)
              name = re.search(r'<key>Name</key>\s*<string>([^<]+)</string>', content).group(1)
          
          with open(os.getenv('CM_ENV'), 'a') as env_file:
              env_file.write(f'\nPROVISIONING_UUID={uuid}')
              env_file.write(f'\nPROVISIONING_NAME={name}')

          def patch_project(file_path):
              with open(file_path, 'r') as f:
                  content = f.read()
              # Force EVERY target to use the Distribution identity and Team ID
              content = re.sub(r'ProvisioningStyle = [^;]+;', 'ProvisioningStyle = Manual;', content)
              content = re.sub(r'DEVELOPMENT_TEAM = [^;]+;', f'DEVELOPMENT_TEAM = {dev_team};', content)
              content = re.sub(r'PROVISIONING_PROFILE_SPECIFIER = [^;]+;', f'PROVISIONING_PROFILE_SPECIFIER = \"{name}\";', content)
              content = re.sub(r'PROVISIONING_PROFILE = [^;]+;', f'PROVISIONING_PROFILE = \"{uuid}\";', content)
              content = re.sub(r'CODE_SIGN_IDENTITY = [^;]+;', 'CODE_SIGN_IDENTITY = \"iPhone Distribution\";', content)
              content = re.sub(r'CODE_SIGN_IDENTITY\[sdk=iphoneos\*\] = [^;]+;', 'CODE_SIGN_IDENTITY = \"iPhone Distribution\";', content)
              with open(file_path, 'w') as f:
                  f.write(content)

          for root, dirs, files in os.walk('ios'):
              for file in files:
                  if file == 'project.pbxproj':
                      patch_project(os.path.join(root, file))
          "

      - name: Build and Archive iOS App
        script: |
          XCODE_WORKSPACE=$(find ios -name "*.xcworkspace" | head -n 1)
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/xcarchive/App.xcarchive \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            PROVISIONING_PROFILE="$PROVISIONING_UUID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_NAME" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            SKIP_INSTALL=NO \
            clean archive

      - name: Export IPA
        script: |
          # V22: Explicitly mapping the Provisioning Profile in the Plist
          mkdir -p build/ios/ipa
          cat > export_options.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>$DEVELOPMENT_TEAM</string>
              <key>uploadSymbols</key>
              <true/>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>$PROVISIONING_NAME</string>
              </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/ios/xcarchive/App.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist export_options.plist \
            -allowProvisioningUpdates
            
    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
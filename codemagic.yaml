workflows:
  ios-workflow:
    name: Nur-Mecca iOS Automatic Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "Codemagic_Key"

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.milltech.nurmecca.app
      groups:
        - apple_auth
      vars:
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.milltech.nurmecca.app"
        DEVELOPMENT_TEAM: "JBMD9M6ZPC"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "U2SA5VYGH7"
        APP_STORE_APP_ID: 6759008303
      node: 20.11.0
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: develop
          include: true
        - pattern: main
          include: true

    scripts:
      - name: Set automatic iOS build number
        script: |
          OFFSET=10 
          BUILD_NUM=$((${CM_BUILD_NUMBER:-1} + $OFFSET))
          echo "BUILD_NUMBER=$BUILD_NUM" >> $CM_ENV
          find . -name "project.pbxproj" -exec sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $BUILD_NUM;/g" {} +

      - name: Initialize Environment & Repair iOS Platform
        script: |
          npm install --ignore-scripts
          mkdir -p www
          if [ ! -f "www/index.html" ]; then echo "<html><body>Nur-Mecca CI</body></html>" > www/index.html; fi
          cat <<EOF > capacitor.config.json
          { "appId": "$BUNDLE_ID", "appName": "Nur-Mecca", "webDir": "www", "bundledWebRuntime": false }
          EOF
          npx cap sync ios

      - name: Force Asset Catalog in Xcode
        script: |
          XCODE_PROJECT=$(find ios -name "*.xcodeproj" | head -n 1)
          if [ -f "$XCODE_PROJECT/project.pbxproj" ]; then
            PBXPROJ="$XCODE_PROJECT/project.pbxproj"
            sed -i '' "s/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g" "$PBXPROJ"
            sed -i '' "s/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = $DEVELOPMENT_TEAM;/g" "$PBXPROJ"
            sed -i '' "s/ASSETCATALOG_COMPILER_APPICON_NAME = [^;]*/ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon/g" "$PBXPROJ"
          fi

      - name: Pre-Archive Global Plist Patch
        script: |
          find ios -name "Info.plist" | while read PLIST_PATH; do
            /usr/libexec/PlistBuddy -c "Delete :CFBundleIconName" "$PLIST_PATH" || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string AppIcon" "$PLIST_PATH"
          done

      - name: Build and Archive iOS App
        script: |
          keychain initialize
          keychain add-certificates || true
          XCODE_WORKSPACE=$(find ios -name "*.xcworkspace" | head -n 1)
          
          PROV_PROFILE_PATH=$(find ~/Library/MobileDevice/Provisioning\ Profiles -name "*.mobileprovision" | head -n 1)
          PROV_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< $(security cms -D -i "$PROV_PROFILE_PATH"))

          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/ios/xcarchive/App.xcarchive \
            -allowProvisioningUpdates \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE="Manual" \
            PROVISIONING_PROFILE_SPECIFIER="$PROV_PROFILE_NAME" \
            archive

      - name: Export and Binary Injection Fix
        script: |
          PROV_PROFILE_PATH=$(find ~/Library/MobileDevice/Provisioning\ Profiles -name "*.mobileprovision" | head -n 1)
          PROV_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< $(security cms -D -i "$PROV_PROFILE_PATH"))
          
          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>$DEVELOPMENT_TEAM</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROV_PROFILE_NAME</string></dict>
            <key>signingStyle</key><string>manual</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/ios/xcarchive/App.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ExportOptions.plist

          # --- BRUTE FORCE IPA INJECTION ---
          IPA_PATH="build/ios/ipa/App.ipa"
          echo "Unzipping IPA to inject missing CFBundleIconName..."
          unzip -q "$IPA_PATH" -d temp_ipa
          
          APP_PATH=$(find temp_ipa/Payload -name "*.app")
          PLIST="$APP_PATH/Info.plist"
          
          echo "Applying fix to binary Plist at $PLIST"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIconName" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string AppIcon" "$PLIST"
          
          echo "Re-signing the binary..."
          /usr/bin/codesign --force --sign "iPhone Distribution" --entitlements ExportOptions.plist "$APP_PATH"
          
          echo "Re-packaging IPA..."
          cd temp_ipa && zip -qr ../App_Fixed.ipa . && cd ..
          mv App_Fixed.ipa "$IPA_PATH"
          rm -rf temp_ipa

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
workflows:
  ios-workflow:
    name: Nur-Mecca iOS Automatic Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "Codemagic_Key"

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.milltech.nurmecca.app
      groups:
        - apple_auth
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.milltech.nurmecca.app"
        DEVELOPMENT_TEAM: "JBMD9M6ZPC"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "U2SA5VYGH7"
        APP_STORE_APP_ID: 6759008303
      node: 20.11.0
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: develop
          include: true
        - pattern: main
          include: true

    scripts:
      - name: Universal Version Overwrite
        script: | 
          echo "Forcing version references to $BUILD_NUMBER"
          find . -name "project.pbxproj" -exec sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" {} +
          
          # Find and update Info.plist files
          PLIST_FILES=$(find ios -name "Info.plist")
          for f in $PLIST_FILES; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$f" || echo "Could not set version in $f"
          done

      - name: Initialize Environment & Repair iOS Platform
        script: |
          npm install --ignore-scripts
          mkdir -p www
          if [ ! -f "www/index.html" ]; then
            echo "<html><body>Nur-Mecca CI</body></html>" > www/index.html
          fi

          # Ensure capacitor.config.json exists for sync
          if [ ! -f "capacitor.config.json" ]; then
            cat <<EOF > capacitor.config.json
            {
              "appId": "$BUNDLE_ID",
              "appName": "Nur-Mecca",
              "webDir": "www",
              "bundledWebRuntime": false
            }
          EOF
          fi

          npx cap sync ios

      - name: Force Manual Signing
        script: |
          PROJECT_FILE=$(find ios -name "project.pbxproj" | head -n 1)
          if [ -f "$PROJECT_FILE" ]; then
            sed -i '' "s/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g" "$PROJECT_FILE"
            sed -i '' "s/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = $DEVELOPMENT_TEAM;/g" "$PROJECT_FILE"
          fi

      - name: Resolve Swift Package Dependencies
        script: |
          # Since you use SPM instead of CocoaPods, we resolve packages here
          xcodebuild -resolvePackageDependencies -workspace "$XCODE_WORKSPACE" -scheme "$XCODE_SCHEME"

      - name: Build and Sign iOS App
        script: |
          if [ -n "$PRIVATE_KEY" ]; then
            mkdir -p ~/.appstoreconnect/private_keys
            echo "$PRIVATE_KEY" | tr -d '\r' > ~/.appstoreconnect/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_IDENTIFIER.p8
          fi

          keychain initialize
          keychain add-certificates || true

          # Find the provisioning profile provided by Codemagic
          PROV_PROFILE_PATH=$(find ~/Library/MobileDevice/Provisioning\ Profiles -name "*.mobileprovision" 2>/dev/null | head -n 1)
          PROV_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< $(security cms -D -i "$PROV_PROFILE_PATH"))

          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/ios/xcarchive/App.xcarchive \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE="Manual" \
            PROVISIONING_PROFILE_SPECIFIER="$PROV_PROFILE_NAME" \
            clean archive

          # Create Export Options
          cat <<EOF > ExportOptions.plist
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>$DEVELOPMENT_TEAM</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROV_PROFILE_NAME</string></dict>
            <key>signingStyle</key><string>manual</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/ios/xcarchive/App.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ExportOptions.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
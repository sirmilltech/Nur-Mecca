workflows:
  ios-workflow:
    name: Nur-Mecca iOS Automatic Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "Codemagic_Key"

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.milltech.nurmecca.app
      groups:
        - apple_auth
      vars:
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.milltech.nurmecca.app"
        DEVELOPMENT_TEAM: "JBMD9M6ZPC"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "U2SA5VYGH7"
        APP_STORE_APP_ID: 6759008303
      node: 20.11.0
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: develop
          include: true
        - pattern: main
          include: true

    scripts:
      - name: Set automatic iOS build number
        script: |
          # Use CM_BUILD_NUMBER and add an offset to avoid "Redundant Binary Upload"
          # Since your last failed build was 6, setting OFFSET to 6 ensures the next is 7+
          OFFSET=6 
          BUILD_NUM=$((${CM_BUILD_NUMBER:-1} + $OFFSET))
          
          echo "Setting Build Number to: $BUILD_NUM (Codemagic Build: $CM_BUILD_NUMBER + Offset: $OFFSET)"
          
          # Export to environment for subsequent scripts
          echo "BUILD_NUMBER=$BUILD_NUM" >> $CM_ENV
          
          # Patch all project files to ensure consistency
          find . -name "project.pbxproj" -exec sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $BUILD_NUM;/g" {} +

      - name: Initialize Environment & Repair iOS Platform
        script: |
          npm install --ignore-scripts
          mkdir -p www
          if [ ! -f "www/index.html" ]; then
            echo "<html><body>Nur-Mecca CI</body></html>" > www/index.html
          fi

          echo "Generating capacitor.config.json..."
          cat <<EOF > capacitor.config.json
          {
            "appId": "$BUNDLE_ID",
            "appName": "Nur-Mecca",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          npx cap sync ios

      - name: Auto-Detect Xcode Paths
        script: |
          DETECTED_WORKSPACE=$(find ios -name "*.xcworkspace" | head -n 1)
          DETECTED_PROJECT=$(find ios -name "*.xcodeproj" | head -n 1)
          
          echo "XCODE_WORKSPACE=$DETECTED_WORKSPACE" >> $CM_ENV
          echo "XCODE_PROJECT=$DETECTED_PROJECT" >> $CM_ENV

      - name: Force Manual Signing in Xcode
        script: |
          if [ -f "$XCODE_PROJECT/project.pbxproj" ]; then
            PBXPROJ="$XCODE_PROJECT/project.pbxproj"
            sed -i '' "s/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g" "$PBXPROJ"
            sed -i '' "s/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = $DEVELOPMENT_TEAM;/g" "$PBXPROJ"
            sed -i '' "s/CODE_SIGN_IDENTITY = [^;]*;/CODE_SIGN_IDENTITY = \"iPhone Distribution\";/g" "$PBXPROJ"
            sed -i '' "s/\"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]\" = [^;]*;/\"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]\" = \"iPhone Distribution\";/g" "$PBXPROJ"
            sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/g" "$PBXPROJ"
          fi

      - name: Patch Info.plist for Versioning
        script: |
          PLIST_PATH=$(find ios -name "Info.plist" | grep -v "Pods" | head -n 1)
          if [ -f "$PLIST_PATH" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "$PLIST_PATH" || /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string $BUNDLE_ID" "$PLIST_PATH"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$PLIST_PATH" || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUMBER" "$PLIST_PATH"
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.0" "$PLIST_PATH" || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.0.0" "$PLIST_PATH"
          fi

      - name: Resolve Swift Package Dependencies
        script: |
          xcodebuild -resolvePackageDependencies -workspace "$XCODE_WORKSPACE" -scheme "$XCODE_SCHEME"

      - name: Build and Sign iOS App
        script: |
          keychain initialize
          keychain add-certificates || true

          PROV_PROFILE_PATH=$(find ~/Library/MobileDevice/Provisioning\ Profiles -name "*.mobileprovision" 2>/dev/null | head -n 1)
          if [ -z "$PROV_PROFILE_PATH" ]; then
            echo "ERROR: No provisioning profile found. Ensure 'ios_signing' is configured correctly."
            exit 1
          fi

          # Extract Profile Name
          PROV_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< $(security cms -D -i "$PROV_PROFILE_PATH"))

          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/ios/xcarchive/App.xcarchive \
            -allowProvisioningUpdates \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE="Manual" \
            PROVISIONING_PROFILE_SPECIFIER="$PROV_PROFILE_NAME" \
            MARKETING_VERSION="1.0.0" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            clean archive

          # Generate ExportOptions
          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$DEVELOPMENT_TEAM</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROV_PROFILE_NAME</string>
            </dict>
            <key>signingStyle</key>
            <string>manual</string>
            <key>uploadBitcode</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/ios/xcarchive/App.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ExportOptions.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
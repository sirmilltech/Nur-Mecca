workflows:
  # --- IOS AUTOMATIC & MANUAL FALLBACK WORKFLOW ---
  ios-workflow:
    name: Nur-Mecca iOS Automatic Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Codemagic_Key"
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.milltech.nurmecca.app
      groups:
        - apple_auth 
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.milltech.nurmecca.app"
        DEVELOPMENT_TEAM: "JBMD9M6ZPC"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "U2SA5VYGH7"
        APP_STORE_APP_ID: 6759008303
      node: 20.11.0
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: develop
          include: true
          source: true
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Initialize Environment
        script: |
          # 1. Use Node 20
          nvm use 20 || nvm install 20
          npm install
          
          # 2. Capacitor build requirement
          npm run build || (mkdir -p www && echo "<html></html>" > www/index.html)
          
          # 3. Verify files for debugging
          echo "Checking directory structure..."
          ls -R ios/App | grep Podfile || echo "Podfile NOT found in ios/App"
          
          # 4. Sync Capacitor
          npx cap sync ios
      - name: Cocoapods installation
        script: |
          # FIX: Explicitly enter the directory where the Podfile lives
          if [ -f "ios/App/Podfile" ]; then
            cd ios/App && pod install
          else
            echo "ERROR: Podfile still not found at ios/App/Podfile"
            find . -name "Podfile"
            exit 1
          fi
      - name: Build and Sign iOS App
        script: |
          # 1. Setup API Key
          if [ -n "$PRIVATE_KEY" ]; then
            mkdir -p ~/.appstoreconnect/private_keys
            echo "$PRIVATE_KEY" | tr -d '\r' > ~/.appstoreconnect/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_IDENTIFIER.p8
          fi

          # 2. Fetch Signing Files
          keychain initialize
          if [ -n "$PRIVATE_KEY" ]; then
            app-store-connect fetch-signing-files "$BUNDLE_ID" \
              --issuer-id "$ISSUER_ID" \
              --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
              --type IOS_APP_STORE \
              --create || true
          fi
          keychain add-certificates || true

          # 3. Handle Manual Fallback
          CERT_COUNT=$(ls ~/Library/Developer/Xcode/UserData/Certificates/*.p12 2>/dev/null | wc -l || echo "0")
          if [ "$CERT_COUNT" -eq 0 ] && [ -n "$MANUAL_P12_BASE64" ]; then
            mkdir -p ~/Library/Developer/Xcode/UserData/Certificates
            echo "$MANUAL_P12_BASE64" | base64 --decode > ~/Library/Developer/Xcode/UserData/Certificates/manual.p12
            security import ~/Library/Developer/Xcode/UserData/Certificates/manual.p12 -P "${MANUAL_P12_PASSWORD:-}" -A || true
          fi

          # 4. Detect Profile
          PROV_PROFILE_PATH=$(find ~/Library/MobileDevice/Provisioning\ Profiles -name "*.mobileprovision" 2>/dev/null | head -n 1)
          if [ -z "$PROV_PROFILE_PATH" ]; then echo "ERROR: No profile found"; exit 1; fi
          
          TMP_PLIST=$(mktemp /tmp/provplist.plist)
          security cms -D -i "$PROV_PROFILE_PATH" > "$TMP_PLIST"
          PROV_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$TMP_PLIST")
          PROV_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$TMP_PLIST")

          # 5. Patch Project
          python3 -c "
          import os, re
          uuid, name, team = '$PROV_PROFILE_UUID', '$PROV_PROFILE_NAME', '$DEVELOPMENT_TEAM'
          for root, dirs, files in os.walk('ios'):
              for file in files:
                  if file == 'project.pbxproj':
                      path = os.path.join(root, file)
                      with open(path, 'r') as f: content = f.read()
                      content = content.replace('ProvisioningStyle = Automatic;', 'ProvisioningStyle = Manual;')
                      pattern = r'(buildSettings = \{)'
                      settings = (r'\1\n\t\t\t\tPROVISIONING_PROFILE = \"' + uuid + '\";' +
                                 r'\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"' + name + '\";' +
                                 r'\n\t\t\t\tDEVELOPMENT_TEAM = ' + team + ';' +
                                 r'\n\t\t\t\tCODE_SIGN_STYLE = Manual;')
                      content = re.sub(pattern, settings, content)
                      with open(path, 'w') as f: f.write(content)
          "

          # 6. Archive and Export
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/ios/xcarchive/App \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_IDENTIFIER.p8 \
            -allowProvisioningUpdates \
            clean archive

          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict><key>method</key><string>app-store</string>
          <key>teamID</key><string>$DEVELOPMENT_TEAM</string>
          <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROV_PROFILE_NAME</string></dict>
          <key>signingStyle</key><string>manual</string></dict></plist>
          EOF

          xcodebuild -exportArchive -archivePath build/ios/xcarchive/App.xcarchive \
            -exportPath build/ios/ipa -exportOptionsPlist ExportOptions.plist \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_IDENTIFIER.p8
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
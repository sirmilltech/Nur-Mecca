workflows:
  ios-workflow:
    name: Nur-Mecca iOS Automatic Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "Codemagic_Key"

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.milltech.nurmecca.app
      groups:
        - apple_auth
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.milltech.nurmecca.app"
        DEVELOPMENT_TEAM: "JBMD9M6ZPC"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "U2SA5VYGH7"
        APP_STORE_APP_ID: 6759008303
      node: 20.11.0
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: develop
          include: true
        - pattern: main
          include: true

    scripts:
      - name: Hard-Force Build Number Update
        script: | 
          echo "Force-updating build number to: $BUILD_NUMBER"
          
          # 1. Update the Info.plist (Standard way)
          INFO_PLIST="ios/App/App/Info.plist"
          if [ -f "$INFO_PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$INFO_PLIST"
          fi
          
          # 2. Update the Project File (The Nuclear Way)
          # This replaces CURRENT_PROJECT_VERSION = 1; with the actual Codemagic build number
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" "$PBXPROJ"
          
          # 3. Use agvtool as a final secondary check
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER

      - name: Initialize Environment & Repair iOS Platform
        script: |
          echo "Node version: $(node -v)"
          npm install --ignore-scripts
          mkdir -p www
          if [ ! -f "www/index.html" ]; then
            echo "<html><body>Nur-Mecca CI</body></html>" > www/index.html
          fi

          echo "Generating capacitor.config.json..."
          cat <<EOF > capacitor.config.json
          {
            "appId": "$BUNDLE_ID",
            "appName": "Nur-Mecca",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          if [ ! -d "ios" ]; then
            npx cap add ios
          elif [ ! -f "ios/App/Podfile" ]; then
            rm -rf ios
            npx cap add ios
          fi

          npx cap sync ios

      - name: Force Manual Signing in Xcode
        script: |
          echo "Disabling Automatic Signing and Injecting Team ID..."
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          sed -i '' "s/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g" "$PBXPROJ"
          sed -i '' "s/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = $DEVELOPMENT_TEAM;/g" "$PBXPROJ"
          sed -i '' "s/CODE_SIGN_IDENTITY = [^;]*;/CODE_SIGN_IDENTITY = \"iPhone Distribution\";/g" "$PBXPROJ"
          sed -i '' "s/\"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]\" = [^;]*;/\"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]\" = \"iPhone Distribution\";/g" "$PBXPROJ"

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Build and Sign iOS App
        script: |
          if [ -n "$PRIVATE_KEY" ]; then
            mkdir -p ~/.appstoreconnect/private_keys
            echo "$PRIVATE_KEY" | tr -d '\r' > ~/.appstoreconnect/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_IDENTIFIER.p8
          fi

          keychain initialize
          keychain add-certificates || true

          PROV_PROFILE_PATH=$(find ~/Library/MobileDevice/Provisioning\ Profiles -name "*.mobileprovision" 2>/dev/null | head -n 1)
          if [ -z "$PROV_PROFILE_PATH" ]; then
            echo "ERROR: No profile found."
            exit 1
          fi

          TMP_PLIST=$(mktemp /tmp/provplist.plist)
          security cms -D -i "$PROV_PROFILE_PATH" > "$TMP_PLIST"
          PROV_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$TMP_PLIST")

          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/ios/xcarchive/App.xcarchive \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE="Manual" \
            PROVISIONING_PROFILE_SPECIFIER="$PROV_PROFILE_NAME" \
            clean archive

          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$DEVELOPMENT_TEAM</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROV_PROFILE_NAME</string>
            </dict>
            <key>signingStyle</key>
            <string>manual</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/ios/xcarchive/App.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ExportOptions.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
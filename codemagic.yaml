workflows:
  ios-workflow:
    name: Nur-Mecca iOS Universal Signing Fix
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "Codemagic_Key"

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.milltech.nurmecca.app
      groups:
        - apple_auth
      vars:
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.milltech.nurmecca.app"
        DEVELOPMENT_TEAM: "JBMD9M6ZPC"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "U2SA5VYGH7"
        APP_STORE_APP_ID: 6759008303
      node: 20.11.0
      xcode: latest

    scripts:
      - name: Increment Build Number
        script: |
          OFFSET=75
          BUILD_NUM=$((${CM_BUILD_NUMBER:-1} + $OFFSET))
          echo "BUILD_NUMBER=$BUILD_NUM" >> $CM_ENV
          find . -name "project.pbxproj" -exec sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $BUILD_NUM;/g" {} +

      - name: Initialize Environment
        script: |
          npm install --ignore-scripts
          npx cap sync ios

      - name: Fetch Signing & Force Manual Configuration
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          
          # Extract the UUID and Name of the profile
          PROV_PROFILE_UUID=$(apple-provisioning-profiles list --bundle-id "$BUNDLE_ID" --type IOS_APP_STORE | grep "UUID" | head -n 1 | awk '{print $2}')
          echo "Hard-patching project with Profile UUID: $PROV_PROFILE_UUID"
          echo "PROV_PROFILE_UUID=$PROV_PROFILE_UUID" >> $CM_ENV
          
          # NUCLEAR SCRIPT: Forces every target in every project to Manual signing with the specific UUID
          python3 -c "
          import os, re
          uuid = '$PROV_PROFILE_UUID'
          team = '$DEVELOPMENT_TEAM'
          
          for root, dirs, files in os.walk('.'):
              for file in files:
                  if file == 'project.pbxproj':
                      path = os.path.join(root, file)
                      with open(path, 'r') as f: content = f.read()
                      
                      # 1. Force Manual Style
                      content = content.replace('ProvisioningStyle = Automatic;', 'ProvisioningStyle = Manual;')
                      content = re.sub(r'CODE_SIGN_STYLE = .*?;', 'CODE_SIGN_STYLE = Manual;', content)
                      
                      # 2. Inject Team and Profile info into Build Settings
                      content = re.sub(r'DEVELOPMENT_TEAM = .*?;', f'DEVELOPMENT_TEAM = {team};', content)
                      content = re.sub(r'PROVISIONING_PROFILE = .*?;', f'PROVISIONING_PROFILE = \"{uuid}\";', content)
                      content = re.sub(r'PROVISIONING_PROFILE_SPECIFIER = .*?;', f'PROVISIONING_PROFILE_SPECIFIER = \"{uuid}\";', content)
                      
                      # 3. Handle TargetAttributes (Clearing out the Cloud-based profile mapping)
                      content = re.sub(r'ProvisioningStyle = Manual;', 'ProvisioningStyle = Manual;', content)
                      
                      with open(path, 'w') as f: f.write(content)
                      print(f'Patched: {path}')
          "

      - name: Build and Archive iOS App
        script: |
          XCODE_WORKSPACE=$(find ios -name "*.xcworkspace" | head -n 1)
          
          # Using CODE_SIGN_ALLOW_CONSTANT_SIGNING_EXAMINATION to force Xcode to use our CLI-provided profile
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/ios/xcarchive/App.xcarchive \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            PROVISIONING_PROFILE_SPECIFIER="$PROV_PROFILE_UUID" \
            PROVISIONING_PROFILE="$PROV_PROFILE_UUID" \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            CODE_SIGN_ALLOW_CONSTANT_SIGNING_EXAMINATION=YES \
            archive

      - name: Export and Post-Processing
        script: |
          xcodebuild -exportArchive \
            -archivePath build/ios/xcarchive/App.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist /Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
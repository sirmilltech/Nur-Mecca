workflows:
  ios-workflow:
    name: Nur-Mecca iOS Export Fix V25
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "Codemagic_Key"

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.milltech.nurmecca.app
      groups:
        - apple_auth
      vars:
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.milltech.nurmecca.app"
        DEVELOPMENT_TEAM: "JBMD9M6ZPC"
      node: 20.11.0
      xcode: latest

    scripts:
      - name: Increment Build Number
        script: |
          OFFSET=100
          BUILD_NUM=$((${CM_BUILD_NUMBER:-1} + $OFFSET))
          echo "BUILD_NUMBER=$BUILD_NUM" >> $CM_ENV
          find . -name "project.pbxproj" -exec sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $BUILD_NUM;/g" {} +

      - name: Initialize Environment
        script: |
          npm install --ignore-scripts
          npx cap sync ios

      - name: Fetch Signing & Brute Force Patch
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          
          python3 -c "
          import os, sys, re, glob
          
          dev_team = os.getenv('DEVELOPMENT_TEAM', 'JBMD9M6ZPC')
          profile_path = glob.glob(os.path.expanduser('~/Library/MobileDevice/Provisioning Profiles/*.mobileprovision'))
          
          if not profile_path:
              print('CRITICAL: No provisioning profile found!')
              sys.exit(1)
          
          target_profile = profile_path[0]
          with open(target_profile, 'rb') as f:
              content = f.read().decode('latin-1')
              uuid = re.search(r'<key>UUID</key>\s*<string>([^<]+)</string>', content).group(1)
              name = re.search(r'<key>Name</key>\s*<string>([^<]+)</string>', content).group(1)
          
          print(f'Using Profile: {name} ({uuid})')
          
          with open(os.getenv('CM_ENV'), 'a') as env_file:
              env_file.write(f'\nPROVISIONING_UUID={uuid}')
              env_file.write(f'\nPROVISIONING_NAME={name}')

          def brute_force_patch(file_path):
              with open(file_path, 'r') as f:
                  lines = f.readlines()
              
              new_lines = []
              for line in lines:
                  line = re.sub(r'ProvisioningStyle = [^;]+;', 'ProvisioningStyle = Manual;', line)
                  line = re.sub(r'DEVELOPMENT_TEAM = [^;]+;', f'DEVELOPMENT_TEAM = {dev_team};', line)
                  line = re.sub(r'PROVISIONING_PROFILE = [^;]+;', f'PROVISIONING_PROFILE = \"{uuid}\";', line)
                  line = re.sub(r'PROVISIONING_PROFILE_SPECIFIER = [^;]+;', f'PROVISIONING_PROFILE_SPECIFIER = \"{name}\";', line)
                  line = re.sub(r'PRODUCT_BUNDLE_IDENTIFIER = [^;]+;', f'PRODUCT_BUNDLE_IDENTIFIER = \"{os.getenv(\"BUNDLE_ID\")}\";', line)
                  line = re.sub(r'CODE_SIGN_IDENTITY = \"[^\"]+\";', 'CODE_SIGN_IDENTITY = \"iPhone Distribution\";', line)
                  line = re.sub(r'\"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]\" = \"[^\"]+\";', '\"CODE_SIGN_IDENTITY[sdk=iphoneos*]\" = \"iPhone Distribution\";', line)
                  new_lines.append(line)
                  
              with open(file_path, 'w') as f:
                  f.writelines(new_lines)

          for root, dirs, files in os.walk('ios'):
              for file in files:
                  if file == 'project.pbxproj':
                      brute_force_patch(os.path.join(root, file))
          "

      - name: Build and Archive iOS App
        script: |
          XCODE_WORKSPACE=$(find ios -name "*.xcworkspace" | head -n 1)
          rm -rf ~/Library/Developer/Xcode/DerivedData
          
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/xcarchive/App.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE="$PROVISIONING_UUID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_NAME" \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            SKIP_INSTALL=NO \
            archive

      - name: Export IPA
        script: |
          mkdir -p build/ios/ipa
          
          # V25: Using printf for a cleaner, safer XML generation
          printf '<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>%s</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>%s</key>
                  <string>%s</string>
              </dict>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>' "$DEVELOPMENT_TEAM" "$BUNDLE_ID" "$PROVISIONING_NAME" > export_options.plist

          xcodebuild -exportArchive \
            -archivePath build/ios/xcarchive/App.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist export_options.plist
            
    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true